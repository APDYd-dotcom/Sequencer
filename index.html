<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequencer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-bar">
        <div class="app-bar-content">
            <div class="logo">
                <div class="dot blue"></div>
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <h1>Sequencer</h1>
        </div>
    </div>
    <main class="container">
        <section class="card transport-card">
            <h2>Transport</h2>
            <div class="transport-controls">
                <button id="playStopBtn" class="button primary">Play</button>
                <label for="bpmSlider">BPM: <span id="bpmValue">100</span></label>
                <input type="range" id="bpmSlider" min="60" max="180" value="100">
                <button id="clearBtn" class="button outline">Clear</button>
                <button id="randomBtn" class="button outline">Random</button>
                <button id="exportBtn" class="button outline">Export</button>
            </div>
        </section>

        <dialog id="exportDialog">
            <div class="export-dialog-content">
                <h3>Export song</h3>
                <p id="exportInfo" class="export-info">Exports steps 1-16 at 100 BPM, about 8.1 s.</p>
                <div class="export-field">
                    <label for="exportRepeat">Repeat</label>
                    <select id="exportRepeat">
                        <option value="1">1 time</option>
                        <option value="2" selected>2 times</option>
                        <option value="4">4 times</option>
                        <option value="8">8 times</option>
                    </select>
                </div>
                <div class="export-field">
                    <label for="exportQuality">Quality</label>
                    <select id="exportQuality">
                        <option value="128">128 kbps</option>
                        <option value="192" selected>192 kbps</option>
                        <option value="320">320 kbps</option>
                    </select>
                </div>
                <progress id="exportProgress" value="0" max="100" hidden></progress>
                <p id="exportStatus" class="export-status" role="status"></p>
                <div class="export-actions">
                    <button id="exportCancelBtn" class="button outline">Close</button>
                    <button id="exportActionBtn" class="button primary">Export MP3</button>
                </div>
            </div>
        </dialog>

        <section class="card grid-card">
            <h2>Sequencer Grid</h2>
            <div class="roll">
                <canvas id="pianoCanvas"></canvas>
                <div class="grid-area">
                    <canvas id="gridCanvas"></canvas>
                </div>
            </div>
            <div class="piano-hint">Click a piano key to hear the note. Click or drag on the grid to place notes in that key's row.</div>
        </section>
        <section class="card keyboard-card">
            <h2>Keyboard</h2>
            <div class="keyboard-map" id="keyboardMap"></div>
        </section>
        <section class="card sound-card">
            <h2>Sound</h2>
            <div class="sound-controls">
                <div class="waveform-select">
                    <label for="waveformSelect">Timbre:</label>
                    <select id="waveformSelect">
                        <!-- Options will be generated by main.js -->
                    </select>
                </div>
                <div class="volume-control">
                    <label for="volumeSlider">Volume: <span id="volumeValue">0.8</span></label>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                </div>
                <div class="adsr-group">
                    <div class="adsr-slider">
                        <label for="attackSlider">Attack (s): <span id="attackValue">0.01</span></label>
                        <input type="range" id="attackSlider" min="0" max="1" step="0.01" value="0.01">
                    </div>
                    <div class="adsr-slider">
                        <label for="decaySlider">Decay (s): <span id="decayValue">0.8</span></label>
                        <input type="range" id="decaySlider" min="0" max="1" step="0.01" value="0.8">
                    </div>
                    <div class="adsr-slider">
                        <label for="sustainSlider">Sustain: <span id="sustainValue">0.4</span></label>
                        <input type="range" id="sustainSlider" min="0" max="1" step="0.01" value="0.4">
                    </div>
                    <div class="adsr-slider">
                        <label for="releaseSlider">Release (s): <span id="releaseValue">0.9</span></label>
                        <input type="range" id="releaseSlider" min="0" max="2" step="0.01" value="0.9">
                    </div>
                </div>
                <canvas id="envelopeCanvas"></canvas>
            </div>
        </section>
    </main>
    <script src="js/timbres.js"></script>
    <script src="js/vendor/lame.min.js"></script>
    <script src="js/export.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/envelope.js"></script>
    <script src="js/piano.js"></script>
    <script src="js/sequencer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
