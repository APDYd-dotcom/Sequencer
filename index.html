<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequencer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-bar">
        <div class="app-bar-content">
            <div class="logo">
                <div class="dot blue"></div>
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <h1>Sequencer</h1>
        </div>
    </div>
    <main class="container">
        <section class="card transport-card">
            <h2>Transport</h2>
            <div class="transport-controls">
                <button id="playStopBtn" class="button primary">Play</button>
                <label for="bpmSlider">BPM: <span id="bpmValue">100</span></label>
                <input type="range" id="bpmSlider" min="60" max="180" value="100">
                <button id="clearBtn" class="button outline">Clear</button>
                <button id="randomBtn" class="button outline">Random</button>
            </div>
        </section>
        <section class="card grid-card">
            <h2>Sequencer Grid</h2>
            <div class="roll">
                <canvas id="pianoCanvas"></canvas>
                <div class="grid-area">
                    <canvas id="gridCanvas"></canvas>
                </div>
            </div>
            <div class="piano-hint">Click a piano key to hear the note. Click or drag on the grid to place notes in that key's row.</div>
        </section>
        <section class="card sound-card">
            <h2>Sound</h2>
            <div class="sound-controls">
                <div class="waveform-select">
                    <label for="waveformSelect">Waveform:</label>
                    <select id="waveformSelect">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Sawtooth</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
                <div class="volume-control">
                    <label for="volumeSlider">Volume: <span id="volumeValue">0.8</span></label>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                </div>
                <div class="adsr-group">
                    <div class="adsr-slider">
                        <label for="attackSlider">Attack (s): <span id="attackValue">0.1</span></label>
                        <input type="range" id="attackSlider" min="0" max="1" step="0.01" value="0.1">
                    </div>
                    <div class="adsr-slider">
                        <label for="decaySlider">Decay (s): <span id="decayValue">0.1</span></label>
                        <input type="range" id="decaySlider" min="0" max="1" step="0.01" value="0.1">
                    </div>
                    <div class="adsr-slider">
                        <label for="sustainSlider">Sustain: <span id="sustainValue">0.5</span></label>
                        <input type="range" id="sustainSlider" min="0" max="1" step="0.01" value="0.5">
                    </div>
                    <div class="adsr-slider">
                        <label for="releaseSlider">Release (s): <span id="releaseValue">0.2</span></label>
                        <input type="range" id="releaseSlider" min="0" max="2" step="0.01" value="0.2">
                    </div>
                </div>
                <canvas id="envelopeCanvas"></canvas>
            </div>
        </section>
    </main>
    <script src="js/audio.js"></script>
    <script src="js/envelope.js"></script>
    <script src="js/sequencer.js"></script>
    <script src="js/piano.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
